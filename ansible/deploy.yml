---
# ansible/deploy.yml
# Deployment playbook — pulls latest code from git and restarts affected services.
# Intentionally separate from site.yml which handles infrastructure configuration.
#
# Usage:
#   Deploy to all VMs:
#     ansible-playbook -i inventory/ deploy.yml
#
#   Deploy to MQTT VM only:
#     ansible-playbook -i inventory/ deploy.yml --limit mqtt
#
#   Override the branch at runtime:
#     ansible-playbook -i inventory/ deploy.yml -e "git_branch=feature/my-branch"

# ── MQTT VM — subscriber and producers ───────────────────────────────────────

- name: Deploy MQTT components
  hosts: mqtt
  gather_facts: false

  vars:
    git_branch: main

  tasks:
    - name: Clone or pull latest monorepo
      ansible.builtin.git:
        repo: "{{ pipeline_repo_url }}"
        dest: "{{ repo_dir }}"
        version: "{{ git_branch }}"
        force: true
      become: true
      register: git_result

    # ── Subscriber ────────────────────────────────────────────────────────────
    - name: Subscriber | Check if requirements.txt exists
      ansible.builtin.stat:
        path: "{{ subscriber_dir }}/requirements.txt"
      register: subscriber_requirements

    - name: Subscriber | Install dependencies
      ansible.builtin.pip:
        requirements: "{{ subscriber_dir }}/requirements.txt"
        virtualenv: "{{ subscriber_venv }}"
        state: present
      become: true
      when: git_result.changed and subscriber_requirements.stat.exists

    - name: Subscriber | Check if script exists
      ansible.builtin.stat:
        path: "{{ subscriber_dir }}/subscriber.py"
      register: subscriber_script

    - name: Subscriber | Restart service if code changed
      ansible.builtin.systemd:
        name: mqtt-subscriber
        state: restarted
      become: true
      when: git_result.changed and subscriber_script.stat.exists

    # ── Producers ─────────────────────────────────────────────────────────────
    # Add a block per producer as new integrations are added.
    # Follow the pattern below: stat guard on requirements.txt and script,
    # then pip install and service restart guarded by both checks.
    #
    # Example — PurpleAir producer:
    #
    # - name: Check if PurpleAir requirements.txt exists
    #   ansible.builtin.stat:
    #     path: "{{ purpleair_dir }}/requirements.txt"
    #   register: purpleair_requirements
    #
    # - name: Install PurpleAir producer dependencies
    #   ansible.builtin.pip:
    #     requirements: "{{ purpleair_dir }}/requirements.txt"
    #     virtualenv: "{{ purpleair_venv }}"
    #     state: present
    #   become: true
    #   when: git_result.changed and purpleair_requirements.stat.exists
    #
    # - name: Check if PurpleAir producer script exists
    #   ansible.builtin.stat:
    #     path: "{{ purpleair_dir }}/producer.py"
    #   register: purpleair_script
    #
    # - name: Restart PurpleAir producer service if code changed
    #   ansible.builtin.systemd:
    #     name: purpleair-producer
    #     state: restarted
    #   become: true
    #   when: git_result.changed and purpleair_script.stat.exists

    - name: QuantAQ Publisher | Check if requirements.txt exists
      ansible.builtin.stat:
        path: "{{ quantaq_dir }}/requirements.txt"
      register: quantaq_requirements

    - name: QuantAQ Publisher | Install QuantAQ producer dependencies
      ansible.builtin.pip:
        requirements: "{{ quantaq_dir }}/requirements.txt"
        virtualenv: "{{ quantaq_venv }}"
        state: present
      become: true
      when: git_result.changed and quantaq_requirements.stat.exists

    - name: Check if PurpleAir producer script exists
      ansible.builtin.stat:
        path: "{{ quantaq_dir }}/producer.py"
      register: quantaq_script
    
    - name: QuantAQ Publisher | Restart QuantAQ producer service if code changed
      ansible.builtin.systemd:
        name: quantaq-producer
        state: restarted
      become: true
      when: git_result.changed and quantaq_script.stat.exists

