---
# ansible/host_vars/mqtt/main.yml

# System user that owns the subscriber/producer venvs and runs the services.
# Only root-level operations (apt, systemd units) use become: true without
# become_user — everything else runs as this user.
mqtt_user: mqtt-worker

# ansible/host_vars/mqtt/main.yml
pipeline_repo_url: "https://github.com/The-Blueprint-Foundation/TBF-Pipeline.git"
pipeline_repo_branch: "main"

# Root directory where the full monorepo is cloned.
pipeline_repo_dir: /opt/tbf-pipeline
pipeline_venv: "{{ pipeline_repo_dir}}/.venv"
