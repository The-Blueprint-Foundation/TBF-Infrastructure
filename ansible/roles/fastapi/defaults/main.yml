---
# ansible/roles/fastapi/defaults/main.yml

fastapi_port: 8000
fastapi_workers: 2

# Root directory where the FastAPI application is cloned.
fastapi_app_dir: /opt/fastapi-app
fastapi_venv: /opt/fastapi-app/.venv

# Python packages are intentionally absent here — they are managed by the
# repository's requirements.txt and installed during deployment via deploy.yml.
