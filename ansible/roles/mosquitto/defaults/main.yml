---
# ansible/roles/mosquitto/defaults/main.yml

mqtt_port: 1883
mqtt_persistence_location: /var/lib/mosquitto/
mqtt_log_dest: /var/log/mosquitto/mosquitto.log

# Root directory where the full monorepo is cloned.
repo_dir: /opt/tbf-pipeline

# Subscriber paths — point into the monorepo subdirectory.
subscriber_dir: "{{ repo_dir }}/subscriber"
subscriber_venv: "{{ subscriber_dir }}/.venv"

publishers_dir: "{{ repo_dir }}/publishers"
quantaq_dir: "{{ publishers_dir }}/quantaq"
quantaq_venv: "{{ quantaq_dir }}/.venv"

# Python packages are intentionally absent here — they are managed by each
# component's requirements.txt and installed during deployment via deploy.yml.
