---
# ansible/roles/mosquitto/tasks/main.yml

# ── Fetch DB credentials from instance metadata ───────────────────────────

- name: Fetch DB username from instance metadata
  ansible.builtin.command:
    cmd: >
      curl -sf -H "Metadata-Flavor: Google"
      http://metadata.google.internal/computeMetadata/v1/instance/attributes/db-user
  register: db_user_result
  changed_when: false

- name: Set db_user fact
  ansible.builtin.set_fact:
    db_user: "{{ db_user_result.stdout }}"

- name: Fetch DB password from instance metadata
  ansible.builtin.command:
    cmd: >
      curl -sf -H "Metadata-Flavor: Google"
      http://metadata.google.internal/computeMetadata/v1/instance/attributes/db-password
  register: db_password_result
  changed_when: false

- name: Set db_password fact
  ansible.builtin.set_fact:
    db_password: "{{ db_password_result.stdout }}"
  no_log: true

# ── Mosquitto ─────────────────────────────────────────────────────────────────

- name: Install Mosquitto and clients
  ansible.builtin.apt:
    name:
      - mosquitto
      - mosquitto-clients
    state: present
  become: true

- name: Template Mosquitto broker config
  ansible.builtin.template:
    src: broker.conf.j2
    dest: /etc/mosquitto/conf.d/broker.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart mosquitto

- name: Ensure Mosquitto is enabled and running
  ansible.builtin.systemd:
    name: mosquitto
    enabled: true
    state: started
  become: true

# ── Subscriber ────────────────────────────────────────────────────────────────
# Note: Python package installation is absent here — dependencies are managed
# by the repository's requirements.txt and installed during deployment via
# deploy.yml.

- name: Set up MQTT subscriber service
  ansible.builtin.include_tasks:
    file: setup_service.yml
  vars:
    service_name: mqtt-subscriber
    service_description: MQTT subscriber service
    service_working_dir: "{{ subscriber_dir }}"
    service_env_file: "{{ subscriber_dir }}/.env"
    service_env_template: subscriber.env.j2
    service_venv: "{{ subscriber_venv }}"
    service_script: subscriber.py

- name: Template subscriber .env file
  ansible.builtin.template:
    src: subscriber.env.j2
    dest: "{{ subscriber_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  become: true

# ── Publishers ─────────────────────────────────────────────────────────────────
# Add an include_tasks block per publisher as new integrations are added.
# Each publisher:
#   1. Defines its path variables in defaults/main.yml
#   2. Has its secrets added to mqtt.tf metadata and variables.tf
#   3. Has a dedicated .env template in templates/ that renders those secrets
#   4. Gets an include_tasks block below referencing setup_service.yml
#
# Example — PurpleAir publisher:
#
# - name: Fetch PurpleAir API key from instance metadata
#   ansible.builtin.command:
#     cmd: >
#       curl -sf -H "Metadata-Flavor: Google"
#       http://metadata.google.internal/computeMetadata/v1/instance/attributes/purpleair-api-key
#   register: purpleair_api_key_result
#   changed_when: false
#   no_log: true
#
# - name: Set PurpleAir API key fact
#   ansible.builtin.set_fact:
#     purpleair_api_key: "{{ purpleair_api_key_result.stdout }}"
#   no_log: true
#
# - name: Set up PurpleAir publisher service
#   ansible.builtin.include_tasks:
#     file: setup_service.yml
#   vars:
#     service_name: purpleair-publisher
#     service_description: PurpleAir air quality data publisher
#     service_working_dir: "{{ purpleair_dir }}"
#     service_env_file: "{{ purpleair_dir }}/.env"
#     service_env_template: purpleair.env.j2
#     service_venv: "{{ purpleair_venv }}"
#     service_script: publisher.py

- name: Fetch QuantAQ API key from instance metadata
  ansible.builtin.command:
    cmd: >
      curl -sf -H "Metadata-Flavor: Google"
      http://metadata.google.internal/computeMetadata/v1/instance/attributes/quantaq-api-key
  register: quantaq_api_key_result
  changed_when: false
  no_log: true

- name: Set QuantAQ API key fact
  ansible.builtin.set_fact:
    quantaq_api_key: "{{ quantaq_api_key_result.stdout }}"
  no_log: true

- name: Set up QuantAQ publisher service
  ansible.builtin.include_tasks:
    file: setup_service.yml
  vars:
    service_name: quantaq-publisher
    service_description: QuantAQ air quality data publisher
    service_working_dir: "{{ quantaq_dir }}"
    service_env_file: "{{ quantaq_dir }}/.env"
    service_env_template: quantaq.env.j2
    service_venv: "{{ quantaq_venv }}"
    service_script: publisher.py
