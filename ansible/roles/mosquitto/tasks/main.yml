---
# ansible/roles/mosquitto/tasks/main.yml

# ── Install base packages ───────────────────────────
- name: Install base packages
  ansible.builtin.apt:
    name: 
      - python3
      - python3-pip
      - python3-venv
      - git
      - curl
    state: present
  become: true

# ── Mosquitto ─────────────────────────────────────────────────────────────────

- name: Install Mosquitto and clients
  ansible.builtin.apt:
    name:
      - mosquitto
      - mosquitto-clients
    state: present
  become: true

- name: Template Mosquitto broker config
  ansible.builtin.template:
    src: broker.conf.j2
    dest: /etc/mosquitto/conf.d/broker.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart mosquitto

- name: Ensure Mosquitto is enabled and running
  ansible.builtin.systemd:
    name: mosquitto
    enabled: true
    state: started
  become: true

# ── Shared application user and repo root ─────────────────────────────────────
# The mqtt_user owns the cloned repo and all component venvs beneath it.
# This user is also referenced by each service's systemd unit.

- name: Create mqtt-worker system user
  ansible.builtin.user:
    name: "{{ mqtt_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Create repo root directory
  ansible.builtin.file:
    path: "{{ pipeline_repo_dir }}"
    state: directory
    owner: "{{ mqtt_user }}"
    group: "{{ mqtt_user }}"
    mode: "0755"
  become: true

- name: Clone or pull latest monorepo
  ansible.builtin.git:
    repo: "{{ pipeline_repo_url }}"
    dest: "{{ pipeline_repo_dir }}"
    version: "{{ pipeline_repo_branch }}"
    force: true
  become: true
  become_user: "{{ mqtt_user }}"
  register: git_result

- name: "Create Python virtual environment"
  ansible.builtin.command:
    cmd: python3 -m venv {{ pipeline_venv }}
    creates: "{{ pipeline_venv }}/bin/activate"
  become: true
  become_user: "{{ mqtt_user }}"

- name: "Upgrade pip in venv"
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: "{{ pipeline_venv }}"
  become: true
  become_user: "{{ mqtt_user }}"
