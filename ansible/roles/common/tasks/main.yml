---
# ansible/roles/common/tasks/main.yml
# Tasks applied to every VM regardless of role.

#---------------------------------------------------------------------------------------------------------
# The `become: true` directives throughout the tasks tell Ansible to run those tasks as root via `sudo`, 
# but that only works if the user Ansible connects as actually has passwordless 'sudo' access on the VM.
#
# The reason it wasn't explicitly set up is that **Debian 12 (your VM image) grants the first user created 
# via `gcloud compute ssh` passwordless sudo automatically** through GCP's OS Login or the default 
# `google-sudoers` configuration that gets applied to GCP VMs. So in practice it just works — but it is 
# implicit rather than explicit, which is a reasonable thing to flag.
#
# If a different base image is ever used or OS Login is disabled, you'd need to uncomment the below task
#---------------------------------------------------------------------------------------------------------
#- name: Ensure ansible user has passwordless sudo
#  ansible.builtin.lineinfile:
#    path: /etc/sudoers.d/ansible
#    line: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL"
#    create: true
#    mode: "0440"
#  become: true
#........................................................

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  become: true

#--GCP Credentials Fetching----------------------------------------------------------------------------
- name: Fetch DB host from instance metadata
  ansible.builtin.command:
    cmd: >
      curl -sf -H "Metadata-Flavor: Google"
      http://metadata.google.internal/computeMetadata/v1/instance/attributes/db-host
  register: db_host_result
  changed_when: false

- name: Set db_host fact
  ansible.builtin.set_fact:
    db_host: "{{ db_host_result.stdout }}"

- name: Fetch DB name from instance metadata
  ansible.builtin.command:
    cmd: >
      curl -sf -H "Metadata-Flavor: Google"
      http://metadata.google.internal/computeMetadata/v1/instance/attributes/db-name
  register: db_name_result
  changed_when: false

- name: Set db_name fact
  ansible.builtin.set_fact:
    db_name: "{{ db_name_result.stdout }}"

- name: Fetch DB username from instance metadata
  ansible.builtin.command:
    cmd: >
      curl -sf -H "Metadata-Flavor: Google"
      http://metadata.google.internal/computeMetadata/v1/instance/attributes/db-user
  register: db_user_result
  changed_when: false

- name: Set db_user fact
  ansible.builtin.set_fact:
    db_user: "{{ db_user_result.stdout }}"

- name: Fetch DB password from instance metadata
  ansible.builtin.command:
    cmd: >
      curl -sf -H "Metadata-Flavor: Google"
      http://metadata.google.internal/computeMetadata/v1/instance/attributes/db-password
  register: db_password_result
  changed_when: false

- name: Set db_password fact
  ansible.builtin.set_fact:
    db_password: "{{ db_password_result.stdout }}"
  no_log: true
#--GCP Credentials Fetched-----------------------------------------------------------------------------