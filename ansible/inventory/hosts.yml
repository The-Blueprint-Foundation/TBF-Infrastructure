---
# ansible/inventory/hosts.yml
# Static inventory — VM SSH access is via IAP tunnel port-forwards
# opened by scripts/tunnel.sh before running any Ansible commands.
#
# Port mapping (must match tunnel.sh local port assignments):
#   fastapi : localhost:2222  → fastapi-vm:22
#   mqtt    : localhost:2223  → mqtt-vm:22
#   proxy   : localhost:2224  → proxy-vm:22

all:
  children:
    fastapi:
      hosts:
        fastapi:
          ansible_host: 127.0.0.1
          ansible_port: 2222
    mqtt:
      hosts:
        mqtt:
          ansible_host: 127.0.0.1
          ansible_port: 2223
    proxy:
      hosts:
        proxy:
          ansible_host: 127.0.0.1
          ansible_port: 2224
